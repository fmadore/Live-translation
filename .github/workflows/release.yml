name: Release installers

# Builds the x64 one-click installers and attaches them to a draft GitHub release, then packages
# native x64 and ARM64 MSIX packages and combines them into one unsigned multi-architecture
# .msixbundle for the Microsoft Store (see docs/microsoft-store.md, docs/packaging-msix.md
# and docs/store-updates.md).
#
# The ordinary installer remains x64. Store packages are x64 + native ARM64 because every
# cloud-provider path is architecture-native.
#
# Release assets: Live.Translation_<version>_<arch>.msix  — sideload/verification packages
#                 Live.Translation_<version>.msixbundle   — the Store submission artifact
#
# Normal flow:   git tag v0.1.2 && git push origin v0.1.2. `prepare` checks the tag against
# the version files and creates the release as a draft; `build` attaches the installers, `msix`
# the x64 and ARM64 packages and `bundle` the Store bundle. Only then does `bundle` publish the
# release, with docs/release-<version>.md from the tagged commit as its body. Until that last
# step nothing is public, so a failed job leaves a draft to re-run rather than a spent version.
# A hyphenated tag (v1.0.0-rc1, v0.5.4-arm64-check) is a pre-release or a build validation: it
# gets the same assets in a draft prerelease, which stays unpublished until a human promotes it.
#
# Backfill a tag: run this workflow manually (Actions tab -> Run workflow) and pass an existing
# tag (e.g. v0.1.1) to rebuild and re-attach its assets. A release that is already published
# keeps its title, body and state; only its assets are replaced.
#
# Submitting the bundle to the Store is done by hand in Partner Center — the submission API is
# a Company-account feature and this is an Individual account. docs/store-updates.md has the
# route and the reason.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build installers for (e.g. v0.1.1)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # dtolnay/rust-toolchain used to set this; rustup, which installs the toolchain now, does not.
  CARGO_TERM_COLOR: always

jobs:
  # Cheap checks before an hour of Windows build time, then the one release every later job
  # uploads to. Three files carry the version: the bundle takes its name and /bv from
  # package.json, the MSIX packages theirs from tauri.conf.json, and Cargo.toml has the crate's
  # own. A tag or a file that disagrees with the others would ship mislabelled packages.
  prepare:
    name: Version check and draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      # No job here needs git credentials after the checkout, so none keeps the token in
      # .git/config: `git ls-remote` below reads a public repository, and `gh` and tauri-action
      # take the token from their environment.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Check the tag against the version files
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          package=$(jq -r .version package.json)
          tauri=$(jq -r .version src-tauri/tauri.conf.json)
          # The first `version =` under [package], not a dependency's.
          cargo=$(awk -F'"' '/^\[/ { in_package = /^\[package\]/ } in_package && /^version[[:space:]]*=/ { print $2; exit }' src-tauri/Cargo.toml)

          if [ "$package" != "$tauri" ] || [ "$package" != "$cargo" ]; then
            echo "::error::The version files disagree: package.json says $package, src-tauri/tauri.conf.json $tauri and src-tauri/Cargo.toml ${cargo:-no [package] version}. Bump all three together."
            exit 1
          fi

          # A suffix after a hyphen is allowed: hyphenated tags are validation builds.
          case "$TAG" in
            "v$package" | "v$package"-?*) ;;
            *)
              echo "::error::Tag $TAG does not match the version files: expected v$package, or v$package-<suffix> for a validation build."
              exit 1
              ;;
          esac

          # A release created for a tag that does not exist would create the tag on publishing,
          # on the default branch.
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::$TAG is not a tag on GitHub."
            exit 1
          fi

          echo "version=$package" >> "$GITHUB_OUTPUT"

      # tauri-action could create the release itself, but not safely here. Given a tag and
      # releaseDraft, it looks only for a draft, so beside a published release (a backfill) it
      # opens a second draft and uploads there. Without releaseDraft it overwrites a published
      # release's title and body with its own inputs, which here were the tag and nothing. So the
      # release is found or created here, and every job uploads to that one.
      - name: Find or create the draft release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # GET /releases/tags/{tag} does not return drafts, so list every release instead.
          listing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | [.tag_name, (.id | tostring), (.draft | tostring)] | @tsv')
          mapfile -t matches < <(awk -F'\t' -v tag="$TAG" '$1 == tag' <<< "$listing")

          case ${#matches[@]} in
            0) id='' state=none ;;
            1)
              IFS=$'\t' read -r _ id draft <<< "${matches[0]}"
              if [ "$draft" = true ]; then state=draft; else state=published; fi
              ;;
            *)
              # `gh release upload` finds a release by its tag, so two would split the assets.
              echo "::error::$TAG has ${#matches[@]} releases. Delete the stray draft on the Releases page, then re-run."
              exit 1
              ;;
          esac

          prerelease=false
          if [[ "$TAG" == *-* ]]; then prerelease=true; fi

          # The `bundle` job publishes a plain tag's release with this file as its body, so it
          # must be in the tagged commit. A release that is already published keeps its body.
          notes="docs/release-$VERSION.md"
          if [ "$prerelease" = false ] && [ "$state" != published ] && [ ! -s "$notes" ]; then
            echo "::error::$notes is missing or empty in $TAG. It becomes the release body, so it has to be in the tagged commit."
            exit 1
          fi

          case $state in
            none)
              if [ "$prerelease" = true ]; then
                title=$TAG
              else
                title="Live Translation & Subtitles $VERSION"
              fi
              id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
                -f tag_name="$TAG" -f name="$title" -F draft=true -F prerelease="$prerelease" \
                --jq .id)
              echo "Created draft release $id for $TAG."
              ;;
            draft) echo "Reusing draft release $id for $TAG." ;;
            published)
              echo "::notice::$TAG is already published; its assets are replaced and its title, body and state are left alone."
              ;;
          esac

          # Without an id tauri-action would skip its uploads silently.
          if ! [[ "$id" =~ ^[0-9]+$ ]]; then
            echo "::error::No release id for $TAG."
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest # x64 Windows
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      # The toolchain CI tested: the version, components and targets (both Windows ones)
      # pinned in rust-toolchain.toml, which rustup reads from the checkout.
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Configure native Whisper compiler
        shell: pwsh
        run: |
          "CC=clang-cl" >> $env:GITHUB_ENV
          "CXX=clang-cl" >> $env:GITHUB_ENV
          "CXXFLAGS=/EHsc" >> $env:GITHUB_ENV
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          prefix-key: whisper-cpu-x64-v2
          # Restore only. A cache saved by a tag run is scoped to that tag, so no other run can
          # restore it: the tag caches had filled 5.6 GB of the repository's 10 GB and pushed
          # CI's caches from main out. Release builds start cold either way.
          save-if: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # With a release id, tauri-action skips its own release lookup and only uploads, replacing
      # assets of the same name. Draft or published is decided by `prepare` and `bundle`.
      - name: Build app and attach installers to the release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: --target ${{ matrix.target }}

  # Microsoft Store package. Tauri has no MSIX bundle target, so @choochmeque/tauri-windows-bundle
  # drives `tauri build --no-bundle` and then packs the payload with the Windows SDK's MakeAppx
  # (it finds the SDK through HKLM\SOFTWARE\Microsoft\Windows Kits\Installed Roots, which is
  # populated on windows-latest — nothing to install). The package is left unsigned on purpose:
  # the Store re-signs it, and an unsigned package is what Partner Center expects.
  #
  # Runs after `build` and uploads to the same release, which is still a draft for a new tag.
  # `gh release upload` finds a draft by its tag as well as a published release. Each
  # architecture has its own Rust cache.
  msix:
    name: MSIX package (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      # As in `build`: the toolchain rust-toolchain.toml pins. Each runner builds for its own
      # architecture.
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Configure native Whisper compiler
        shell: pwsh
        run: |
          "CC=clang-cl" >> $env:GITHUB_ENV
          "CXX=clang-cl" >> $env:GITHUB_ENV
          "CXXFLAGS=/EHsc" >> $env:GITHUB_ENV
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          # Keep the native Windows package lanes separate. Bump with `.cargo/config.toml`:
          # whisper-rs-sys does not rebuild ggml when its GGML_* variables change.
          prefix-key: whisper-cpu-${{ matrix.arch }}-v2
          # Restore only, as in `build`.
          save-if: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Writes an architecture-specific .msix and a single-architecture .msixbundle wrapper.
      # Only the bare .msix is kept: the `bundle` job below combines both architectures into
      # the one multi-architecture bundle the Store submission wants.
      - name: Build MSIX package
        run: npm run bundle:msix:${{ matrix.arch }}

      # msixbundle-cli names its output after the manifest DisplayName ("Live Translation &
      # Subtitles"), which makes a poor release asset, so rename to the convention the NSIS
      # and MSI assets already follow.
      - name: Name the package
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $msix = Get-ChildItem 'src-tauri/target/msix' | Where-Object Extension -eq '.msix' | Select-Object -First 1
          if (-not $msix) { throw 'tauri-windows-bundle produced no .msix.' }
          $msixAsset = Join-Path 'src-tauri/target/msix' "Live.Translation_${version}_${{ matrix.arch }}.msix"
          Move-Item -LiteralPath $msix.FullName -Destination $msixAsset -Force
          "msix=$msixAsset" >> $env:GITHUB_OUTPUT

      # The bare .msix is what a tester signs and installs locally (scripts/install-local-msix.ps1):
      # signing a bundle does not sign the packages inside it, so a bundle cannot be side-loaded
      # for verification.
      - name: Attach the MSIX to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "${{ inputs.tag || github.ref_name }}"
          "${{ steps.package.outputs.msix }}" --clobber

      # Handed to the `bundle` job, which needs both architectures on one runner.
      - name: Upload the MSIX for bundling
        uses: actions/upload-artifact@v7
        with:
          name: msix-${{ matrix.arch }}
          path: ${{ steps.package.outputs.msix }}
          retention-days: 1
          if-no-files-found: error

  # One multi-architecture .msixbundle carrying both packages. This is the Store submission
  # artifact, and it has to be a single file: `msstore publish` uploads one package and marks
  # only the first existing package with a matching extension for deletion, so two separate
  # single-architecture bundles would leave a stale one behind on every update
  # (docs/store-updates.md).
  bundle:
    name: Store bundle (x64 + ARM64)
    needs: msix
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Download both architectures
        uses: actions/download-artifact@v8
        with:
          pattern: msix-*
          path: packages
          merge-multiple: true

      - name: Bundle
        id: bundle
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version

          $packages = Get-ChildItem 'packages' -Filter *.msix
          if ($packages.Count -ne 2) {
            throw "Expected an x64 and an ARM64 .msix, found $($packages.Count): $($packages.Name -join ', ')"
          }

          # MakeAppx ships with the Windows SDK, which is preinstalled on windows-latest.
          # Take the highest SDK version rather than assuming one.
          $makeAppx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $makeAppx) { throw 'MakeAppx.exe was not found; the Windows SDK is missing.' }

          $bundle = "Live.Translation_${version}.msixbundle"
          # /bv must be a four-part version and at least as high as the packages inside it.
          & $makeAppx.FullName bundle /d 'packages' /p $bundle /bv "$version.0" /o
          if ($LASTEXITCODE -ne 0) { throw "MakeAppx failed with exit code $LASTEXITCODE" }

          "bundle=$bundle" >> $env:GITHUB_OUTPUT

      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "${{ inputs.tag || github.ref_name }}"
          "${{ steps.bundle.outputs.bundle }}" --clobber

      # The last step of a release: every asset is attached, so the draft can go public, with the
      # prepared body from the tagged commit (`prepare` checked it is there). A hyphenated tag is
      # never published here. A release that is already published (a backfill, or a re-run after
      # this step) is left as it is, so its body is never rewritten.
      - name: Publish the release
        if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $isDraft = gh release view $env:TAG --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0) { throw "Could not read the release for $env:TAG." }
          if ($isDraft -ne 'true') {
            Write-Output "::notice::$env:TAG is already published; its title and body are left as they are."
            exit 0
          }

          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release edit $env:TAG --draft=false --latest `
            --title "Live Translation & Subtitles $version" `
            --notes-file "docs/release-${version}.md"
          if ($LASTEXITCODE -ne 0) { throw "Publishing $env:TAG failed with exit code $LASTEXITCODE." }
