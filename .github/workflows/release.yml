name: Release installers

# Builds one-click installers for Windows (x64 + ARM64) and attaches them to the
# GitHub release for the pushed tag.
#
# Normal flow:   git tag v0.1.2 && git push origin v0.1.2  -> builds + publishes.
# Backfill a tag: run this workflow manually (Actions tab -> Run workflow) and pass
# an existing tag (e.g. v0.1.1) to add the other platforms' installers to it.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build installers for (e.g. v0.1.1)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest      # x64 Windows
            target: x86_64-pc-windows-msvc
          - platform: windows-11-arm      # ARM64 Windows (Snapdragon)
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install Rust (stable + target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # The speech model for keyless on-device subtitles is not committed; tauri.conf.json
      # bundles it as an app resource, so it has to be present before the build.
      - name: Fetch on-device speech model
        run: npm run fetch:whisper-model

      - name: Build app and publish installers to the release
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: ${{ inputs.tag || github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
