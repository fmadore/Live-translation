name: Release installers

# Builds one-click installers for Windows x64 and attaches them to the GitHub release
# for the pushed tag, then packages the same app as an unsigned MSIX for the Microsoft
# Store (see docs/microsoft-store.md and docs/packaging-msix.md).
#
# x64 only: ggml (whisper.cpp), which backs the keyless on-device caption engine, refuses
# to build with MSVC on ARM64 — "MSVC is not supported for ARM, use clang" — and
# whisper-rs-sys pins the Visual Studio CMake generator, which always uses cl.exe. Getting
# clang-cl in would mean forcing the Ninja generator plus a hand-rolled MSVC developer
# environment. Windows on ARM runs x64 apps under emulation and the Store serves the x64
# package to ARM64 devices, so those machines are still covered. Native ARM64 comes back
# for free if the on-device engine ever moves to the Speech Recognition Windows AI API,
# which needs no C++ build at all.
#
# Normal flow:   git tag v0.1.2 && git push origin v0.1.2  -> builds + publishes.
# Backfill a tag: run this workflow manually (Actions tab -> Run workflow) and pass
# an existing tag (e.g. v0.1.1) to add the other platforms' installers to it.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build installers for (e.g. v0.1.1)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest      # x64 Windows
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install Rust (stable + target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # The speech model for keyless on-device subtitles is not committed; tauri.conf.json
      # bundles it as an app resource, so it has to be present before the build.
      - name: Fetch on-device speech model
        run: npm run fetch:whisper-model

      - name: Build app and publish installers to the release
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: ${{ inputs.tag || github.ref_name }}
          # A hyphenated tag (v1.0.0-rc1, v0.5.4-arm64-check) is a pre-release or a build
          # validation, so it stays an unpublished draft until a human promotes it. Plain
          # version tags publish as before.
          releaseDraft: ${{ contains(inputs.tag || github.ref_name, '-') }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          args: --target ${{ matrix.target }}

  # Microsoft Store package. Tauri has no MSIX bundle target, so @choochmeque/tauri-windows-bundle
  # drives `tauri build --no-bundle` and then packs the payload with the Windows SDK's MakeAppx
  # (it finds the SDK through HKLM\SOFTWARE\Microsoft\Windows Kits\Installed Roots, which is
  # populated on windows-latest — nothing to install). The package is left unsigned on purpose:
  # the Store re-signs it, and an unsigned package is what Partner Center expects.
  #
  # Runs after `build` because it uploads to the release that job creates, and because it then
  # restores that job's Rust cache instead of compiling whisper.cpp from cold a second time.
  msix:
    name: MSIX package (x64)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install Rust (stable + target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Same reason as the installer job: the model is a bundled Tauri resource and is not
      # committed. The bundler copies `bundle.resources` into the package payload, so it has
      # to be on disk before packing or the Store build ships without on-device subtitles.
      - name: Fetch on-device speech model
        run: npm run fetch:whisper-model

      # tauri-windows-bundle build --arch x64 --runner npm. Writes
      # src-tauri/target/msix/<DisplayName>_<version>_x64.msix and the .msixbundle wrapper.
      - name: Build MSIX package
        run: npm run bundle:msix

      # msixbundle-cli names its output after the manifest DisplayName ("Live Translation &
      # Subtitles"), which makes a poor release asset, so rename to the convention the NSIS
      # and MSI assets already follow.
      - name: Name the release asset
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (-not (Test-Path 'src-tauri/target/appx/x64/models/*.bin')) {
            throw 'No speech model in the package payload; the MSIX would ship without on-device subtitles.'
          }
          $built = Get-ChildItem 'src-tauri/target/msix' -Filter '*.msixbundle' | Select-Object -First 1
          if (-not $built) { throw 'tauri-windows-bundle produced no .msixbundle.' }
          $asset = Join-Path 'src-tauri/target/msix' "Live.Translation_${version}_x64.msixbundle"
          Move-Item -LiteralPath $built.FullName -Destination $asset -Force
          "asset=$asset" >> $env:GITHUB_OUTPUT

      - name: Attach the MSIX to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag || github.ref_name }}" "${{ steps.package.outputs.asset }}" --clobber
