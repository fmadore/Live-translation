name: CI

# Checks on every push/PR: front-end format/type-check/lint/tests/build, Rust format/lint/tests,
# with coverage reported in the job summaries, then the interface in Edge and the app end to end
# on Windows. (release.yml builds the installers; this keeps day-to-day changes honest.
# audit.yml runs the full dependency audit weekly.)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request's new push supersedes its running checks. A push to main never does: with one
# group for main, a second merge within minutes cancelled the release merge's run (or, queued
# behind it, could be replaced by a third), leaving the commit to tag without a green run. So
# each main commit gets a group of its own and runs to the end.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # dtolnay/rust-toolchain used to set this; rustup, which installs the toolchain now, does not.
  CARGO_TERM_COLOR: always

jobs:
  # Whether a pull request changes anything but prose, for the slow jobs (rust, styles, e2e):
  # a pull request that only edits Markdown, docs/ or LICENSE skips them. Everything else runs
  # them, and so does every push to main: release.yml's `prepare` releases a commit only once
  # a CI run on it has concluded `success`, and a run whose jobs were skipped concludes
  # `success` too, so a docs-only commit on main would otherwise pass that check on the
  # strength of whatever main's last code commit did, failed or not. Main always gets the full
  # run, and its caches stay warm. `frontend` and the cheap jobs always run (vitest reads the
  # version files, CITATION.cff and source; no test reads docs/ or a Markdown file today: a
  # test that starts to must take its file out of the pattern below).
  # No branch rule requires these checks today. If one is added, a skipped job reports success
  # to it, though a skipped matrix job reports under its unexpanded name ("rust"), not as
  # "rust (windows-latest)".
  # Any doubt runs everything: another event, a merge commit without two parents, a failed
  # git command.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      # The pull request's merge commit and its first parent, the base it merges into: their
      # difference is exactly what the pull request changes.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Decide whether only prose changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ] &&
            git rev-parse --verify --quiet 'HEAD^2' > /dev/null &&
            files=$(git diff --name-only 'HEAD^1' HEAD) && [ -n "$files" ]; then
            echo "Changed files:"
            echo "$files"
            # Prose: Markdown anywhere, docs/ and LICENSE. Anything else is code.
            if ! printf '%s\n' "$files" | grep -Ev '\.md$|^docs/|^LICENSE$' > /dev/null; then
              code=false
              echo "Only prose changed: rust, styles and e2e are skipped."
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # A failure on one Node version says nothing about the other: let both finish.
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      # No job in this workflow pushes, so no checkout leaves the token in .git/config for a
      # later step (or a compromised dependency) to read.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # The Rust job below runs `cargo fmt --check`; this is the frontend's half of that.
      - name: prettier
        run: npm run format:check

      - name: svelte-check
        run: npm run check

      # What svelte-check cannot see: unhandled promises, unkeyed lists, reactive loops, a
      # switch that misses a case of a union, a stale svelte-ignore, {@html}.
      - name: eslint
        run: npm run lint

      - name: unused files, exports and dependencies (knip)
        run: npm run knip

      - name: unit tests
        if: matrix.node != 24
        run: npm test

      # The same tests, instrumented on one lane only: the report would be identical on both.
      # Coverage is reported, not gated, apart from per-file floors on the pure modules.
      - name: unit tests with coverage
        if: matrix.node == 24
        run: npm run test:coverage

      - name: coverage summary
        if: matrix.node == 24
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: production build
        run: npm run build

      # Only what ships: the app bundles the Tauri API and the fonts, nothing else from npm. The
      # full audit, dev tooling included, failed unrelated pull requests over advisories that
      # cannot reach a user (14 of 26 failed runs from August to early October); audit.yml runs
      # it weekly instead.
      - name: dependency audit (shipped packages, moderate and above)
        run: npm audit --omit=dev --audit-level=moderate

  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # No `needs: frontend`: waiting for the frontend checks only delayed the slow Windows lanes,
    # and nothing here uses their output.
    # The Windows lane is essential: the WASAPI loopback implementation is behind
    # cfg(windows), so an Ubuntu-only job never even compiles the event-day audio path.
    strategy:
      fail-fast: false
      matrix:
        # Exercise the portable logic and both supported Windows architectures, including
        # native WASAPI and Win32/WinRT bindings. Packaging still runs in release.yml.
        # Ubuntu by version, not `ubuntu-latest`: this lane apt-installs WebKitGTK 4.1 and GTK 3
        # by package name, and `ubuntu-latest` moving to a new release (26.04, from 19 October
        # 2026) can rename or drop them under it. Move it on purpose, with those packages.
        # macOS on Apple silicon (issue #195): the Core Audio tap, AppKit overlay and Save
        # panel code is behind cfg(target_os = "macos"), and the smoke test runs Whisper on
        # Apple's CPU. By version, like Ubuntu, so the macOS and Xcode under it move on purpose:
        # macos-26 has Xcode 26, the SDK App Store Connect requires, as macos.yml, release.yml
        # and app-store.yml use.
        os: [ubuntu-24.04, windows-latest, windows-11-arm, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # `tauri::generate_context!()` embeds `frontendDist` (`../build`) when the crate compiles
      # with `custom-protocol`, which `--all-features` turns on, and fails if the folder is
      # missing. Nothing this job runs reads what is in it: Clippy and the tests open no window
      # and serve no asset, and the only files the Rust code includes or opens are sources
      # (`src/lib/*.json`, the capability files, `tauri.conf.json`) and the audio fixtures in
      # src-tauri/resources/. So a one-page stub stands in for `npm ci` and `npm run build`,
      # which cost the ARM64 lane, the slowest, 2–2.5 minutes a run. The e2e job and
      # release.yml embed the real build.
      - name: Stub the frontend for the Tauri context
        shell: bash
        run: |
          mkdir -p build
          printf '%s\n' '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Live Translation</title></head><body></body></html>' > build/index.html

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev pkg-config cmake clang libclang-dev \
            libvulkan-dev glslc mesa-vulkan-drivers

      - name: Configure native Whisper compiler
        if: runner.os == 'Windows'
        uses: ./.github/actions/whisper-compiler

      # The version, components and targets pinned in rust-toolchain.toml, which rustup reads
      # from the working directory. llvm-tools is for the Ubuntu lane's instrumented tests.
      - name: Install Rust (rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          if [ "$RUNNER_OS" = Linux ]; then rustup component add llvm-tools-preview; fi

      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          # Bump when `.cargo/config.toml` changes: whisper-rs-sys does not rebuild ggml when
          # its GGML_* variables change, so a restored cache would keep the old instruction sets.
          prefix-key: whisper-cpu-${{ runner.arch }}-v2
          # Preserve the native dependency build when an app lint/test fails.
          cache-on-failure: true
          # Only main saves. A pull request can restore main's cache but not another pull
          # request's, so what each one saved (about 660 MB on the ARM64 lane) only pushed
          # main's entries out of the 10 GB the repository gets.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The Whisper Vulkan helper (src-tauri/whisper-vulkan) builds with LunarG's SDK on
      # Windows, with the distribution's Vulkan packages on Linux. Windows ARM64 builds it in
      # release.yml; this lane and Linux keep it compiling, linting and tested in between.
      - name: Vulkan SDK
        if: matrix.os == 'windows-latest'
        uses: ./.github/actions/vulkan-sdk

      - name: rustfmt
        run: cargo fmt --all --check
        working-directory: src-tauri

      # The helper's short target folder (next step) is outside src-tauri/target, so the Rust
      # cache above never held it, and the step rebuilt whisper.cpp with its Vulkan backend from
      # cold on every run (10 min 09 s on a commit that only moved vite), with release.yml's
      # `prepare` waiting on this run. This caches that folder on its own.
      # What is reused: cargo fingerprints a registry dependency (whisper-rs-sys, whose build
      # script runs ggml's CMake build, the slow part) by its version, features, flags,
      # environment and compiler, never by file times (a non-path package's rerun-if-changed is
      # not tracked), so a restored build stays fresh whatever the checkout's times.
      # What is not: the path crate (whisper-vulkan itself) is fingerprinted by the times of its
      # sources, which a fresh checkout makes newer, so it alone recompiles, in seconds; that is
      # also why rust-cache drops workspace crates' artefacts rather than trusting them.
      # The key's first hash is what whisper-rs-sys does not watch, because its build script does
      # not rerun when they change: the GGML_* variables (.cargo/config.toml), the compiler
      # (whisper-compiler), the Vulkan SDK version (vulkan-sdk) and the toolchain. The restore
      # prefix keeps it, so a change there starts cold rather than from a stale ggml. The second
      # hash, the lock file and the helper's sources, may fall back to the newest older entry.
      # Only main saves, as for the Rust cache: the 10 GB the repository gets.
      - name: Restore the Whisper Vulkan helper build
        id: wv-cache
        if: matrix.os == 'windows-latest'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/wv
          key: whisper-vulkan-${{ runner.arch }}-${{ hashFiles('.cargo/config.toml', 'rust-toolchain.toml', '.github/actions/vulkan-sdk/action.yml', '.github/actions/whisper-compiler/action.yml') }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/whisper-vulkan/**') }}
          restore-keys: |
            whisper-vulkan-${{ runner.arch }}-${{ hashFiles('.cargo/config.toml', 'rust-toolchain.toml', '.github/actions/vulkan-sdk/action.yml', '.github/actions/whisper-compiler/action.yml') }}-

      # On Windows the helper builds in a short target folder: ggml configures its Vulkan shader
      # generator as a nested CMake project deep inside Cargo's build folder, and under
      # src-tauri/target its paths pass Windows' 260-character limit (rc.exe then cannot write
      # its files). scripts/build-whisper-vulkan.mjs does the same for releases.
      # PowerShell, not Git Bash: Git Bash rewrites environment values that look like paths for
      # the programs it starts, which turned CXXFLAGS=/EHsc into C:/Program Files/Git/EHsc.
      - name: clippy and tests (Whisper Vulkan helper)
        id: wv
        if: matrix.os == 'windows-latest' || runner.os == 'Linux'
        shell: pwsh
        run: |
          if ($IsWindows) { $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'wv' }
          cargo clippy --locked -p whisper-vulkan --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p whisper-vulkan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        working-directory: src-tauri

      # Saved after a failed lint or test too, like the Rust cache's `cache-on-failure`: the
      # native build is what is worth keeping. Incremental data only serves the path crate,
      # which recompiles anyway, so it is left out of the 10 GB.
      - name: Prune the Whisper Vulkan helper build for the cache
        if: >-
          !cancelled() && matrix.os == 'windows-latest' && github.ref == 'refs/heads/main' &&
          steps.wv-cache.outputs.cache-hit != 'true' &&
          (steps.wv.outcome == 'success' || steps.wv.outcome == 'failure')
        shell: pwsh
        run: Remove-Item -Recurse -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'wv/debug/incremental')

      - name: Save the Whisper Vulkan helper build
        if: >-
          !cancelled() && matrix.os == 'windows-latest' && github.ref == 'refs/heads/main' &&
          steps.wv-cache.outputs.cache-hit != 'true' &&
          (steps.wv.outcome == 'success' || steps.wv.outcome == 'failure')
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/wv
          key: ${{ steps.wv-cache.outputs.cache-primary-key }}

      - name: clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
        working-directory: src-tauri

      - name: tests
        if: runner.os != 'Linux'
        run: cargo test --locked --all-features
        working-directory: src-tauri

      # The Ubuntu lane runs the same tests instrumented, for a coverage report that gates
      # nothing. The smoke test below adds its profile to the same report. `--no-report` keeps
      # earlier profiles, so the clean drops any the Rust cache restored (dependencies stay).
      - name: tests (instrumented)
        if: runner.os == 'Linux'
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report --locked --all-features
        working-directory: src-tauri

      # The smoke test copies a cached model whose hash matches the pin instead of downloading
      # it again (38–104 s a run); the real download path has its own tests on a local server.
      # Unlike the Rust cache, pull requests may save this one: it is saved only on a miss and
      # its key changes only with the model pin, so it is 31 MiB once per pin, and a pull
      # request that changes the pin would otherwise download the model on every push.
      - name: Cache the smoke-test Whisper model
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/whisper-smoke-model
          key: whisper-smoke-${{ runner.os }}-${{ hashFiles('src-tauri/src/whisper/models.rs') }}

      # Each smoke test names its test by full path with --exact and then insists on
      # "1 passed": a filter that matches nothing exits 0, so a renamed or moved test would
      # otherwise pass here without running, as the SDE step below already guards against.
      - name: Local Whisper multilingual CPU smoke test
        if: runner.os != 'Linux'
        timeout-minutes: 10
        # PowerShell, not Git Bash, as for the helper above: Git Bash rewrote CXXFLAGS=/EHsc into
        # a path for the programs it started, and the C++ build scripts cargo reran then failed.
        shell: pwsh
        env:
          WHISPER_SMOKE_MODEL_CACHE: ${{ runner.temp }}/whisper-smoke-model
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'smoke.log'
          cargo test --locked --all-features --lib whisper::tests::local_whisper_smoke -- --exact --ignored --nocapture | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path $log -Pattern 'test result: ok\. 1 passed' -Quiet)) {
            Write-Output '::error::The smoke test did not run'
            exit 1
          }
        working-directory: src-tauri

      - name: Local Whisper multilingual CPU smoke test (instrumented)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          WHISPER_SMOKE_MODEL_CACHE: ${{ runner.temp }}/whisper-smoke-model
        run: |
          set -o pipefail
          cargo llvm-cov test --no-report --locked --all-features --lib \
            whisper::tests::local_whisper_smoke -- --exact --ignored --nocapture |
            tee "$RUNNER_TEMP/smoke.log"
          grep -q 'test result: ok\. 1 passed' "$RUNNER_TEMP/smoke.log" ||
            { echo '::error::The smoke test did not run'; exit 1; }
        working-directory: src-tauri

      # The whole graphics-processor path — the helper started, the model loaded and every
      # window decoded through it — on Mesa's software Vulkan renderer (lavapipe), which the
      # helper accepts only when the test asks. Slow, and no measure of speed; it proves the
      # messages, the fallback-free path and the captions, which GitHub's GPU-less runners
      # cannot otherwise show.
      - name: Local Whisper smoke test through the Vulkan helper (lavapipe, instrumented)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        env:
          WHISPER_SMOKE_MODEL_CACHE: ${{ runner.temp }}/whisper-smoke-model
          GGML_VK_VISIBLE_DEVICES: "0"
        run: |
          set -o pipefail
          cargo build --locked -p whisper-vulkan
          WHISPER_VULKAN_HELPER="$PWD/target/debug/whisper-vulkan" cargo llvm-cov test \
            --no-report --locked --all-features --lib whisper::tests::local_whisper_vulkan_smoke \
            -- --exact --ignored --nocapture | tee "$RUNNER_TEMP/smoke-vulkan.log"
          grep -q 'test result: ok\. 1 passed' "$RUNNER_TEMP/smoke-vulkan.log" ||
            { echo '::error::The Vulkan smoke test did not run'; exit 1; }
        working-directory: src-tauri

      - name: Rust coverage summary
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: |
          {
            echo '### Rust coverage (Ubuntu lane)'
            echo '```'
            cargo llvm-cov report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The x64 build compiles ggml for AVX2 (`.cargo/config.toml`), and a processor without it
      # must be refused before any of that code runs. Intel SDE emulates Goldmont Plus, the
      # pre-AVX core in cheap Windows 11 Celeron and Pentium Silver laptops, and stops the
      # process on any instruction that core lacks: this step passing shows the test binary
      # starts without executing AVX code and that the runtime gate reports the CPU unsupported.
      - name: Set up Intel SDE
        if: matrix.os == 'windows-latest'
        # Mirrors Intel's archive and checks it against the SHA-256 Intel publishes. SDE is under
        # the Intel Simplified Software License, which permits unmodified redistribution.
        uses: petarpetrovt/setup-sde@6d2773bc0ef3005fd52e0ae0bb91782321793aec # v6.0
        with:
          environmentVariableName: SDE_PATH
          sdeVersion: 10.13.1

      - name: Whisper CPU gate on a pre-AVX processor (Intel SDE)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 10
        shell: pwsh
        working-directory: src-tauri
        run: |
          # The unit-test binary the tests step already built; --no-run only reports its path.
          $exe = cargo test --locked --all-features --lib --no-run --message-format=json |
            ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.executable } |
            Select-Object -Last 1 -ExpandProperty executable
          if (-not $exe) { throw 'Could not find the unit-test binary' }
          & "$env:SDE_PATH\sde.exe" -glp -- $exe `
            whisper::cpu::tests::refuses_a_processor_without_avx --exact --ignored --nocapture |
            Tee-Object -Variable output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # A renamed test would match nothing and "pass"; insist that it actually ran.
          if (-not ($output -match '1 passed')) { throw 'The CPU gate test did not run' }

  # The operator window's computed styles and horizontal overflow (`e2e/style`), against the
  # production bundle in Edge: the engine WebView2 embeds, and already on the runner image, so
  # Playwright downloads no browser. Snapshots are text and never written on CI.
  styles:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: production build
        run: npm run build

      - name: computed styles and overflow (Playwright, Edge)
        run: npm run test:style

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: style-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The real app end to end (`e2e/native`): a debug build with its own identifier, driven over
  # WebView2's DevTools port. Its own job rather than steps on the Windows Rust lane, which it
  # would have made the slowest: `tauri build` compiles the app with `custom-protocol`, which
  # the test builds do not, so little of that lane's work carries over anyway.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Embedded in the exe; the suite's build step does not run `beforeBuildCommand`.
      - name: production build
        run: npm run build

      # As in the rust job.
      - name: Configure native Whisper compiler
        uses: ./.github/actions/whisper-compiler

      # As in the rust job: what rust-toolchain.toml pins.
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          # The rust job's prefix, so bumping it there for `.cargo/config.toml` clears this one
          # too; the job name keeps the two caches apart.
          prefix-key: whisper-cpu-${{ runner.arch }}-v2
          cache-on-failure: true
          # Only main saves, as in the rust job.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The Tiny model the smoke test caches, when there is one: the Whisper spec copies it in
      # rather than downloading it through the interface. Restored only; the rust job saves it.
      - name: Restore the smoke-test Whisper model
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/whisper-smoke-model
          key: whisper-smoke-${{ runner.os }}-${{ hashFiles('src-tauri/src/whisper/models.rs') }}

      - name: end to end (Playwright over WebView2)
        timeout-minutes: 30
        env:
          WHISPER_SMOKE_MODEL_CACHE: ${{ runner.temp }}/whisper-smoke-model
        run: npm run test:e2e

      # The app's log, a trace of both windows and screenshots, for a failed test.
      - name: Upload failure results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # By digest, like the SHA-pinned actions: a tag can be moved, a digest cannot. Dependabot
      # does not update `docker://` references, so take the new digest from Docker Hub when
      # moving to a new actionlint.
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

  # RustSec advisories against src-tauri/Cargo.lock, with the Linux-only ones that cannot reach
  # the Windows or Mac app ignored, each with its reason, in src-tauri/.cargo/audit.toml. A prebuilt,
  # checksum-verified cargo-audit rather than rustsec/audit-check, which compiled it on every
  # run (about 3 minutes) and targets Node 20.
  rust-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          # 0.22.2, not 0.23.0 (published 10 November 2026): install-action checks a download
          # against its own manifest, and v2.90.3's stops at 0.22.2; a version it does not list
          # would leave that check. Move with the first install-action release that lists 0.23.
          tool: cargo-audit@0.22.2

      # `cargo-audit audit` is what `cargo audit` runs. Called directly because `cargo` is a
      # rustup proxy that would first install the whole pinned toolchain, which reading a
      # lockfile does not need. Fails on a vulnerability; warnings are listed in the log.
      - name: RustSec audit
        run: cargo-audit audit
        working-directory: src-tauri
