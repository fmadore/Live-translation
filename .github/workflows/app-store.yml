name: Mac App Store

# The Mac App Store build (docs/mac-app-store.md): the same app as the disk image, free, in the
# App Sandbox, signed for the store and sent to App Store Connect, where it reaches TestFlight
# and then App Review. Run by hand only, on the tag or branch chosen. macos.yml already builds
# and starts a sandboxed variant on every push; this job adds the store's configuration
# (src-tauri/tauri.appstore.conf.json), the provisioning profile and the store's signatures.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-store-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  upload:
    name: Sign and upload to App Store Connect
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the store's secrets
        env:
          APPLE_DISTRIBUTION_CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_DISTRIBUTION_IDENTITY: ${{ secrets.APPLE_DISTRIBUTION_IDENTITY }}
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_APP_ID: ${{ vars.APPLE_APP_ID }}
        run: |
          missing=()
          for name in APPLE_DISTRIBUTION_CERTIFICATE APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD \
            APPLE_DISTRIBUTION_IDENTITY APPLE_INSTALLER_CERTIFICATE APPLE_INSTALLER_CERTIFICATE_PASSWORD \
            APPLE_INSTALLER_IDENTITY APPLE_PROVISIONING_PROFILE APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets for the Mac App Store: ${missing[*]}. See docs/mac-app-store.md."
            exit 1
          fi
          # The app's Apple ID in App Store Connect (App Information), which --upload-package
          # needs: not a secret, so a repository variable.
          if [ -z "$APPLE_APP_ID" ]; then
            echo "::error::Missing the repository variable APPLE_APP_ID (the app's Apple ID in App Store Connect)."
            exit 1
          fi

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          prefix-key: whisper-cpu-${{ runner.arch }}-v2
          save-if: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Import the certificates into a temporary keychain
        env:
          APPLE_DISTRIBUTION_CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/store.keychain-db"
          password=$(openssl rand -base64 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_DISTRIBUTION_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo "$APPLE_INSTALLER_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k "$keychain" \
            -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$keychain" \
            -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productbuild
          rm "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/installer.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Write the provisioning profile
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode > src-tauri/macos/embedded.provisionprofile

      # CFBundleVersion must rise with every upload, rejected ones included: this workflow's run
      # number always does. Built unsigned; the next step signs it with the store's identity.
      - name: Build the app with the store's configuration and profile
        run: >-
          npx tauri build --bundles app --no-sign
          --config src-tauri/tauri.appstore.conf.json
          --config '{"bundle":{"macOS":{"bundleVersion":"${{ github.run_number }}","files":{"embedded.provisionprofile":"./macos/embedded.provisionprofile"}}}}'

      - name: Sign the app and the installer package
        env:
          APPLE_DISTRIBUTION_IDENTITY: ${{ secrets.APPLE_DISTRIBUTION_IDENTITY }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
        run: |
          app="src-tauri/target/release/bundle/macos/Live Translation.app"
          test -f "$app/Contents/Resources/container-migration.plist" \
            || { echo "::error::The container migration manifest is missing."; exit 1; }
          codesign --force --sign "$APPLE_DISTRIBUTION_IDENTITY" --options runtime --timestamp=none \
            --entitlements src-tauri/macos/AppStore.plist "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements - --xml "$app" 2>/dev/null | plutil -p -
          xcrun productbuild --sign "$APPLE_INSTALLER_IDENTITY" \
            --component "$app" /Applications "$RUNNER_TEMP/Live-Translation.pkg"

      # `--upload-app` is deprecated; `--upload-package` names the app and the build. altool from
      # Xcode 26 can exit 0 on a failed upload, so its output is read for errors as well.
      - name: Validate and upload the package
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_APP_ID: ${{ vars.APPLE_APP_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$APPLE_API_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          # Its success lines read "No errors validating" and "No errors uploading".
          failed() {
            if grep -Ei 'error|failed' "$1" | grep -viq 'no errors'; then
              echo "::error::altool reported a failure; see its output above."
              exit 1
            fi
          }
          xcrun altool --validate-app --type macos --file "$RUNNER_TEMP/Live-Translation.pkg" \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER" 2>&1 | tee "$RUNNER_TEMP/validate.log"
          failed "$RUNNER_TEMP/validate.log"
          xcrun altool --upload-package "$RUNNER_TEMP/Live-Translation.pkg" --type macos \
            --apple-id "$APPLE_APP_ID" --bundle-id io.github.fmadore.live-translation \
            --bundle-short-version-string "$version" --bundle-version "$BUILD_NUMBER" \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER" 2>&1 | tee "$RUNNER_TEMP/upload.log"
          failed "$RUNNER_TEMP/upload.log"

      - name: Remove the keychain, the key and the profile
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/store.keychain-db" || true
          rm -rf "$HOME/.appstoreconnect" src-tauri/macos/embedded.provisionprofile
