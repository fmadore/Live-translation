<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1017"/>
      <stop offset="55%" stop-color="#12151d"/>
      <stop offset="100%" stop-color="#0b1a18"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#4f8cff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4f8cff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <ellipse cx="1120" cy="120" rx="420" ry="300" fill="url(#glow)"/>

  <!-- App mark: src-tauri/icons/source.svg at 100 px -->
  <g transform="translate(80,54) scale(0.09765625)">
    <defs>
      <linearGradient id="markTile" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1b2029"/>
        <stop offset="1" stop-color="#0d1015"/>
      </linearGradient>
      <radialGradient id="markGlow" cx="0.25" cy="0.2" r="0.9">
        <stop offset="0" stop-color="#10b981" stop-opacity="0.16"/>
        <stop offset="0.6" stop-color="#10b981" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1024" height="1024" rx="224" fill="url(#markTile)"/>
    <rect width="1024" height="1024" rx="224" fill="url(#markGlow)" stroke="#2a2f3a" stroke-width="15"/>
    <g fill="none" stroke-width="72" stroke-linecap="round" stroke-linejoin="round">
      <path stroke="#5ad1a0" d="M184 496 C222 496 232 344 280 344 C330 344 340 648 390 648 C436 648 444 428 486 428 C524 428 530 544 562 544 C586 544 592 496 620 496 L840 496"/>
      <path stroke="#e7e9ee" d="M500 680 L840 680"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
    <text x="212" y="104" font-size="54" font-weight="700" fill="#e7e9ee"
          letter-spacing="-1">Live Translation &amp; Subtitles</text>
    <text x="212" y="144" font-size="23" font-weight="400" fill="#9aa3b2">Live captions and translation over your meetings, video calls and slides</text>
  </g>

  <rect x="80" y="192" width="1120" height="2" fill="url(#rule)"/>

  <!-- Mock caption overlay: a translated caption with the original speech beneath it -->
  <g transform="translate(80,226)">
    <rect width="1120" height="254" rx="22" fill="#171a21" stroke="#2a2f3a" stroke-width="1.5"/>
    <g font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
      <circle cx="44" cy="45" r="7" fill="#ff5c5c"/>
      <text x="62" y="52" font-size="19" font-weight="600" fill="#ff5c5c" letter-spacing="1.6">LIVE</text>
      <text x="140" y="52" font-size="19" font-weight="500" fill="#4f8cff">DE &#8594; EN</text>
      <text x="252" y="52" font-size="19" font-weight="400" fill="#9aa3b2">system audio &#183; always-on-top overlay</text>

      <text x="44" y="120" font-size="38" font-weight="600" fill="#e7e9ee">On the next slide, the results from all six</text>
      <text x="44" y="166" font-size="38" font-weight="600" fill="#e7e9ee">countries, starting with Benin.</text>
      <text x="44" y="214" font-size="24" font-weight="400" fill="#6ee7b7" opacity="0.85">Auf der n&#228;chsten Folie die Ergebnisse aus allen sechs L&#228;ndern, zuerst Benin.</text>
    </g>
  </g>

  <!-- What it does -->
  <g font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="500">
    <rect x="80"  y="522" width="214" height="46" rx="23" fill="#1e222b" stroke="#2a2f3a"/>
    <text x="187" y="552" text-anchor="middle" fill="#c9cfdb">Offline Whisper</text>

    <rect x="310" y="522" width="300" height="46" rx="23" fill="#1e222b" stroke="#2a2f3a"/>
    <text x="460" y="552" text-anchor="middle" fill="#c9cfdb">Gemini &#183; OpenAI &#183; Mistral</text>

    <rect x="626" y="522" width="262" height="46" rx="23" fill="#1e222b" stroke="#2a2f3a"/>
    <text x="757" y="552" text-anchor="middle" fill="#c9cfdb">SRT &#183; VTT &#183; Markdown</text>

    <rect x="904" y="522" width="296" height="46" rx="23" fill="#1e222b" stroke="#2a2f3a"/>
    <text x="1052" y="552" text-anchor="middle" fill="#c9cfdb">Windows 11 &#183; x64 &#183; ARM64</text>
  </g>
</svg>
