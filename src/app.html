<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Live Translation &amp; Subtitles</title>
		<script>
			// The operator window's theme, on the root before the stylesheet paints a frame: the
			// app mounts only after its scripts load, and until then a light desktop would see
			// the dark ground. `src/lib/theme.ts` owns the setting and keeps it in step from
			// there; this mirrors its `loadTheme` and `resolveTheme`, and `theme.test.ts` runs
			// it. The overlay keeps the dark tokens, so it is left alone.
			(function () {
				if (location.pathname.indexOf('/overlay') === 0) return;
				var choice = null;
				try {
					choice = localStorage.getItem('appearance.theme');
				} catch (e) {}
				var light =
					choice === 'light' ||
					(choice !== 'dark' &&
						typeof matchMedia === 'function' &&
						matchMedia('(prefers-color-scheme: light)').matches);
				document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
