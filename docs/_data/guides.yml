  blurb: Pause, two caption languages, spending guard, profiles and shortcuts.
- page: caption-layout.md
  title: Caption layout
  blurb: Overlay placement, reading modes and custom filler-word lists.
- page: language-coverage.md
  title: Caption languages
  blurb: Supported spoken and target languages across every engine.
- page: transcript-export.md
  title: Transcript export
  blurb: Plain text, Markdown, SRT and WebVTT, with original speech and markers.
