[package]
name = "live-translation"
version = "0.4.0"
description = "Real-time speech translation and same-language subtitle overlay"
authors = ["Frédérick Madore"]
edition = "2021"
rust-version = "1.88"

[lib]
# Tauri's mobile/desktop entrypoint lives in the lib; main.rs is a thin shim.
name = "live_translation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` backs the transparent overlay on macOS; harmless on Windows/Linux.
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime + WebSockets for the realtime providers.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-util = "0.7"
# Uses the OS-native TLS stack (SChannel on Windows, Secure Transport on macOS). This
# avoids rustls' `ring` dependency, which needs `clang` to assemble its asm on
# aarch64-windows — SChannel is pure-Rust here and keeps the ARM64 build toolchain-free.
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = "0.3"

# Audio capture.
cpal = "0.18"

# Encoding / config / errors / logging.
base64 = "0.23"
# v4's default `v1` feature selects Windows Credential Manager, macOS Keychain, and
# Secret Service backends while preserving the synchronous Entry API used here.
keyring = "4.1"
dotenvy = "0.15"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# WASAPI loopback capture is Windows-only.
[target.'cfg(windows)'.dependencies]
# Direct event-driven WASAPI access for render-device loopback capture.
wasapi = "0.23"

[features]
# Standard Tauri production feature: serve the bundled front-end assets over the custom
# protocol instead of the dev server. Enabled automatically by `tauri build`.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
